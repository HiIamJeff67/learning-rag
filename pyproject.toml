[project]
name = "learning-rag"
version = "0.1.0"
description = "Shared experiments for learning RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "markdown-it-py>=4.2.0",
    "pdfplumber>=0.11.10",
]

[project.scripts]
learning-rag = "learning_rag:main"

[dependency-groups]
dev = [
    "pytest",
    "reportlab>=5.1.0",
]

[tool.basedpyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["uv_build>=0.13.4"]
build-backend = "uv_build"
