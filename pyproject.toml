[project]
name = "learning-rag"
version = "0.1.0"
description = "Shared experiments for learning RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
learning-rag = "learning_rag:main"

[dependency-groups]
dev = ["pytest"]

[tool.basedpyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["uv_build>=0.13.4"]
build-backend = "uv_build"
